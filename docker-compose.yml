version: '3.9'

services:
  postgres:
    image: imresamu/postgis:16-3.4
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: yol_asistani
      POSTGRES_USER: yol_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yol_user -d yol_asistani"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/turkey-latest.osrm --max-table-size 10000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
